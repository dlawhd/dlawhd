
# GitHub 프로필 민트색 잔디 + 뱀 애니메이션
# 역할: 실제 GitHub 기여 기록을 SVG 이미지로 생성하고 자동 갱신합니다.

name: Generate Mint Snake

# 1. 자동 실행 조건
on:
  # 매일 한국 시간 오전 9시쯤 실행되도록 예약합니다.
  # GitHub Actions의 cron은 UTC 기준입니다.
  # 예약 실행은 GitHub 상황에 따라 지연될 수 있습니다.
  schedule:
    - cron: "0 0 * * *"

  # Actions 화면에서 직접 실행할 수 있게 합니다.
  workflow_dispatch:

# 2. 결과 이미지를 저장할 수 있도록 쓰기 권한을 부여합니다.
permissions:
  contents: write

# 3. 실제 작업
jobs:
  generate:
    runs-on: ubuntu-latest

    # 작업이 오래 걸릴 경우를 대비해 실행 시간을 제한합니다.
    timeout-minutes: 10

    steps:
      # 4. GitHub 기여 기록을 민트색 SVG로 변환합니다.
      - name: Generate mint snake
        uses: Platane/snk/svg-only@v3
        with:
          # 현재 GitHub 계정의 기여 기록을 사용합니다.
          github_user_name: dlawhd

          # 결과 이미지 두 개를 생성합니다.
          # 첫 번째: 밝은 화면용
          # 두 번째: 어두운 화면용
          #
          # color_dots는 총 5가지 색상입니다.
          # color_snake는 움직이는 뱀의 색상입니다.
          outputs: |
            dist/github-snake.svg?color_snake=%230F7660&color_dots=%23EBF7F0,%23C0EAD5,%2383D3AE,%2342AB82,%23176B54
            dist/github-snake-dark.svg?color_snake=%2356D6AD&color_dots=%23161B22,%231C4439,%23276952,%2337A77C,%2356D6AD

      # 5. 생성된 SVG 파일을 output 브랜치에 저장합니다.
      - name: Publish snake images
        uses: peaceiris/actions-gh-pages@v4
        with:
          # GitHub가 자동으로 제공하는 인증 토큰입니다.
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # 이미지 파일만 저장하는 별도 브랜치입니다.
          publish_branch: output

          # 위 단계에서 생성한 이미지가 들어 있는 폴더입니다.
          publish_dir: ./dist
